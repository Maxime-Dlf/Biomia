name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crassecadia/client exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Résultats Playwright (captures, contextes d'erreur)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/client/e2e/.results
          # Dossier caché (`.results`) : exclu par défaut par upload-artifact v4.
          include-hidden-files: true
          retention-days: 7
